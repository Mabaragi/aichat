spring:
  application:
    name: aichat

  datasource:
    url: jdbc:sqlite:./data/ai-debate.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: aichat
    access-token-seconds: 900
    refresh-token-seconds: 1209600
